name: Brain Phase 4 Contract
on:
  pull_request:
    branches: [jarvis-v4-field-test]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --test test/heartbeat-engine.test.js
