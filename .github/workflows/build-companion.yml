name: Build JARVIS Companion
on:
  workflow_dispatch:
  push:
    branches: [jarvis-fitcloud-companion]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: companion } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/jarvis-companion-test.apk
          cd "$GITHUB_WORKSPACE"
          gh release view companion-test >/dev/null 2>&1 || gh release create companion-test --title "JARVIS Companion Test" --notes "Installable field-test build for the JARVIS Android companion."
          gh release upload companion-test /tmp/jarvis-companion-test.apk --clobber
