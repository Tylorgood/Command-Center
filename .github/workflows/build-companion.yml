name: Build JARVIS Companion
on:
  workflow_dispatch:
  push:
    branches: [jarvis-fitcloud-companion]
    paths: ['companion/**', '.github/workflows/build-companion.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: companion } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
