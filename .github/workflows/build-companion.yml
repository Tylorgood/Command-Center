name: Build JARVIS Companion
on:
  workflow_dispatch:
  push:
    branches: [jarvis-fitcloud-companion]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: companion } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
