ENTS</button><button data-type="recent">RECENT</button></nav><div class="list-head"><div><span class="kicker" id="listKicker">ROLODEX</span><h2 id="listTitle">People</h2></div><span id="resultCount">—</span></div><div class="entity-grid" id="entityGrid"></div></section></main><aside class="detail" id="detail" hidden><header><div><span class="kicker" id="detailType">ENTITY</span><h2 id="detailName">Detail</h2></div><button id="closeDetail">×</button></header><div id="detailBody"></div></aside><div class="toast" id="toast" hidden role="status"></div><script type="module" src="./app.js"></script></body></html>
